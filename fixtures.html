<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A63 League</title>
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/season-8.css">
</head>

<body>
    <header class="homepage-header">
        <div class="header-content">
            <span class="title">A63 League</span>
            <h1>SZN 7</h1>
        </div>
    </header>

<main>
    <section class="fixtures-section">

        <div class="gameweek-container">

            <!-- Gameweek navigation -->
            <div class="gameweek-navigation">

                <button id="previous-gameweek"
                        class="gameweek-arrow"
                        aria-label="Previous gameweek">
                    &#10094;
                </button>

                <div class="gameweek-heading">
                    <span class="gameweek-season">
                        A63 LEAGUE · SEASON 8
                    </span>

                    <h2 id="gameweek-title">
                        Gameweek 1
                    </h2>
                </div>

                <button id="next-gameweek"
                        class="gameweek-arrow"
                        aria-label="Next gameweek">
                    &#10095;
                </button>

            </div>

            <!-- Fixture cards generated by JavaScript -->
            <div id="fixtures-container"
                 aria-live="polite">
                <p>Loading fixtures...</p>
            </div>

        </div>

    </section>
</main>
    <!-- ================= Navigation ================= -->
    <nav class="navigation-bar">
        <ul class="navigation-bar">
            <li>
                <a href="/">
                    <div>icon</div>
                    <div>Home</div>
                </a>
            </li>
            <li>
                <a href="/fantasy">
                    <div>icon</div>
                    <div>Fantasy</div>
                </a>
            </li>
            <li>
                <a href="/fixtures">
                    <div>icon</div>
                    <div>Fixtures</div>
                </a>
            </li>
            <li>
                <a href="/more">
                    <div>icon</div>
                    <div>More</div>
                </a>
            </li>
        </ul>
    </nav>
    <script src="js/data.js"></script>
    <script src="js/fixtures.js"></script>
</body>
</html>
