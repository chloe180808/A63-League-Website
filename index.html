<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A63 League</title>
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/season-8.css">

<body>
    <header class="homepage-header">
        <div class="header-content">
            <span class="title">A63 League</span>
            <h1>SZN 7</h1>
        </div>

    <main>

        <!-- ================= League Table ================= -->

        <section class="league-section">
            <div class="section-heading">
                <h2>LEAGUE TABLE</h2>
            </div>
            <table class="league-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Team</th>
                        <th>P</th>
                        <th>W</th>
                        <th>D</th>
                        <th>L</th>
                        <th>+/-</th>
                        <th>Dif</th>
                        <th>Pts</th>
                    </tr>
                </thead>
                <tbody id="league-table-body">
                </tbody>
            </table>
        </section>

    <!-- ================= Knockout Stage ================= -->

        <section class="knockout-section">
            <div class="section-heading">
                <h2>KNOCKOUT STAGE</h2>
            </div>

            <div class="knockouts-container" id="knockout-fixtures">
            </div>
        </section>  
    </main>
    <!-- ================= Navigation ================= -->
    <nav class="navigation-bar">
        <ul class="navigation-bar">
            <li>
                <div>icon</div>
